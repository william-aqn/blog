{% comment %} Machine-readable "made with AI" mark in the head of a post with "ai: true"; the WebPage @id is the mainEntityOfPage of the jekyll-seo-tag JSON-LD {% endcomment %}
<meta name="ai-disclosure" content="{{ site.data.ai_mark.disclosure }}" />
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebPage", "@id": {{ page.url | absolute_url | jsonify }}, "digitalSourceType": {{ site.data.ai_mark.digital_source_type | jsonify }}}</script>
